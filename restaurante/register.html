<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <main class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">
      Create account
    </h1>

    <form id="registerForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">
          Email
        </label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">
          Password
        </label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <!-- ROLE SELECTION -->
      <div>
        <p class="block text-sm font-medium text-gray-700 mb-2">
          Select role
        </p>

        <div class="flex gap-4">
          <button
            type="button"
            data-role="User"
            class="flex-1 border border-gray-300 rounded-lg py-2 text-gray-700 hover:bg-gray-100 transition"
          >
            User
          </button>

          <button
            type="button"
            data-role="Admin"
            class="flex-1 border border-gray-300 rounded-lg py-2 text-gray-700 hover:bg-gray-100 transition"
          >
            Admin
          </button>
        </div>

        <!-- aquí JS mostrará el rol seleccionado -->
        <p id="selectedRole" class="text-black text-black-600 mt-2 justify-center items-center text-center"></p>
      </div>

      <button
      id="registerbtn"
        type="submit"
        class="w-full bg-green-600 text-white font-medium py-2 rounded-lg hover:bg-green-700 transition"
      >
        Create account
      </button>
    </form>

    <p class="text-sm text-gray-600 text-center mt-6">
      Already have an account?
      <a href="index.html" class="text-green-600 font-medium hover:underline">
        Login
      </a>
    </p>
  </main>
  <script src="./js/auth/register.js" type="module"></script>
</body>
</html>
