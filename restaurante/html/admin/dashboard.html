<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { protectRoute } from '../../js/guards/authGuard.js';
        protectRoute('Admin');
    </script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Admin Panel</h1>
        <button id="logOut" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded">Log out</button>
    </nav>

    <main class="container mx-auto p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Dashboard</h2>

        <!-- Metrics -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                <h3 class="text-gray-500 font-bold mb-1">Total Pedidos</h3>
                <p class="text-3xl font-bold" id="total-orders">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-yellow-500">
                <h3 class="text-gray-500 font-bold mb-1">Pendientes</h3>
                <p class="text-3xl font-bold" id="pending-orders">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                <h3 class="text-gray-500 font-bold mb-1">Ingresos (Día)</h3>
                <p class="text-3xl font-bold" id="total-income">$0.00</p>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-4 border-b">
                <h3 class="text-lg font-bold text-gray-700">Gestión de Ordenes</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm uppercase">
                            <th class="p-4 border-b">ID</th>
                            <th class="p-4 border-b">Cliente</th>
                            <th class="p-4 border-b">Total</th>
                            <th class="p-4 border-b">Fecha</th>
                            <th class="p-4 border-b">Estado</th>
                            <th class="p-4 border-b">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="text-gray-700">
                        <!-- Ordenes renderizadas -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="../../js/admin/dashboard.js"></script>
</body>

</html>
