<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { protectRoute } from '../../js/guard.js';
        protectRoute('user');
    </script>
</head>

<body class="bg-gray-50 min-h-screen">

    <nav class="bg-orange-500 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-10">

            <span>🛒</span> Tienda Tech

    <main class="container mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Productos Disponibles</h2>

        <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Products will load here -->

    <script type="module" src="../../js/user/shop.js"></script>
