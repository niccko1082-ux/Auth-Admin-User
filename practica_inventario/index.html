<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tienda Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6 text-orange-600">Tienda Tech</h1>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700">Email</label>
                <input type="email" id="email" class="w-full border rounded px-3 py-2" placeholder="user@test.com"
                    required>
            </div>

            <div>
                <label class="block text-gray-700">Password</label>
                <input type="password" id="password" class="w-full border rounded px-3 py-2" placeholder="123" required>
            </div>

            <button type="submit" class="w-full bg-orange-500 text-white py-2 rounded hover:bg-orange-600 transition">
                Ingresar
            </button>
        </form>

        <div class="mt-4 text-sm text-gray-500 text-center">
            <p>Admin (Manager): admin@test.com / 123</p>
            <p>User (Cliente): user@test.com / 123</p>
        </div>
    </div>

    <script type="module" src="./js/auth.js"></script>
</body>

</html>
