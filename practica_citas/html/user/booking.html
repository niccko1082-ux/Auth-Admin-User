<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Citas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { protectRoute } from '../../js/guard.js';
        protectRoute('user');
    </script>
</head>

<body class="bg-gray-50 min-h-screen">

    <nav class="bg-teal-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-10">
        <h1 class="font-bold text-xl flex items-center gap-2">
            <span>🏥</span> Hospital App
        </h1>
        <div class="flex items-center gap-4">
            <span id="user-email" class="text-sm font-medium"></span>
            <button id="logoutBtn"
                class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Salir</button>
        </div>
    </nav>

    <main class="container mx-auto p-6 max-w-5xl">

        <div class="flex flex-col md:flex-row gap-8">

            <!-- Available Slots -->
            <div class="w-full md:w-2/3">
                <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Turnos Disponibles</h2>
                <div id="availableSlots" class="grid grid-cols-1 gap-4">
                    <!-- Slots render here -->
                </div>
            </div>

            <!-- My Appointments -->
            <div class="w-full md:w-1/3">
                <div class="bg-white p-6 rounded-lg shadow-md sticky top-20 border border-gray-200">
                    <h2 class="text-xl font-bold mb-4 text-teal-700">Mis Citas</h2>
                    <div id="myAppointments" class="space-y-3">
                        <!-- My appointments render here -->
                        <p class="text-gray-400 italic text-sm text-center py-4">Sin citas agendadas.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="../../js/user/booking.js"></script>
</body>

</html>
