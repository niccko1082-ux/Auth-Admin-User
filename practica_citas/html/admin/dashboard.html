<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestión de Citas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { protectRoute } from '../../js/guard.js';
        protectRoute('admin');
    </script>
</head>

<body class="bg-gray-100 min-h-screen">

    <nav class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="font-bold text-xl flex items-center gap-2">
            <span>📅</span> Admin Citas
        </h1>
        <div class="flex items-center gap-4">
            <span id="user-email" class="text-sm font-medium"></span>
            <button id="logoutBtn"
                class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Salir</button>
        </div>
    </nav>

    <main class="container mx-auto p-6 flex flex-col lg:flex-row gap-8">

        <!-- Add Slot Form -->
        <div class="lg:w-1/3">
            <div class="bg-white p-6 rounded-lg shadow-md sticky top-6">
                <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Crear Turno</h2>
                <form id="addSlotForm" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">Doctor/Especialidad</label>
                        <input type="text" id="doctor" class="w-full border rounded px-3 py-2 mb-2"
                            placeholder="Dr. House" required>
                        <input type="text" id="specialty" class="w-full border rounded px-3 py-2"
                            placeholder="Diagnóstico" required>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Fecha</label>
                            <input type="date" id="date" class="w-full border rounded px-3 py-2" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Hora</label>
                            <input type="time" id="time" class="w-full border rounded px-3 py-2" required>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold transition shadow">
                        Agregar Turno
                    </button>
                </form>
            </div>
        </div>

        <!-- Appointment List -->
        <div class="lg:w-2/3">
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Agenda Médica</h2>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-100 border-b text-gray-600 uppercase text-xs">
                            <tr>
                                <th class="p-4">Doctor</th>
                                <th class="p-4">Fecha/Hora</th>
                                <th class="p-4">Paciente</th>
                                <th class="p-4">Estado</th>
                                <th class="p-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="slotList">
                            <!-- Slots Render Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script type="module" src="../../js/admin/dashboard.js"></script>
</body>

</html>
