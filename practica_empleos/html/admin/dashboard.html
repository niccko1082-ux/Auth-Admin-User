<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Reclutamiento</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { protectRoute } from '../../js/guard.js';
        protectRoute('admin');
    </script>
</head>

<body class="bg-gray-100 min-h-screen">

    <nav class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="font-bold text-xl flex items-center gap-2">
            <span>👥</span> Panel de Reclutamiento
        </h1>
        <div class="flex items-center gap-4">
            <span id="user-email" class="text-sm font-medium"></span>
            <button id="logoutBtn"
                class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Salir</button>
        </div>
    </nav>

    <main class="container mx-auto p-6 flex flex-col lg:flex-row gap-8">

        <!-- Post Job Form -->
        <div class="lg:w-1/3">
            <div class="bg-white p-6 rounded-lg shadow-md sticky top-6">
                <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Publicar Oferta</h2>
                <form id="postJobForm" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">Título del Puesto</label>
                        <input type="text" id="title" class="w-full border rounded px-3 py-2"
                            placeholder="Full Stack Dev" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">Empresa</label>
                        <input type="text" id="company" class="w-full border rounded px-3 py-2" placeholder="Tech Co"
                            required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">Salario (USD)</label>
                        <input type="number" id="salary" class="w-full border rounded px-3 py-2" placeholder="3000"
                            required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">Descripción</label>
                        <textarea id="description" class="w-full border rounded px-3 py-2 h-24"
                            placeholder="Requisitos..." required></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold transition shadow">
                        Publicar
                    </button>
                </form>
            </div>
        </div>

        <!-- Jobs & Applicants -->
        <div class="lg:w-2/3 space-y-6">

            <!-- Jobs List -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="p-4 border-b bg-gray-50">
                    <h2 class="text-xl font-bold text-gray-800">Mis Ofertas Activas</h2>
                </div>
                <div id="adminJobList" class="divide-y divide-gray-100">
                    <!-- Jobs Render Here -->
                </div>
            </div>

            <!-- Applicants Viewer (Hidden by default) -->
            <div id="applicantsPanel"
                class="hidden bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-blue-500">
                <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-gray-800">Postulantes: <span id="selectedJobTitle"
                            class="text-blue-600"></span></h2>
                    <button id="closePanel" class="text-gray-400 hover:text-gray-600 font-bold">✕</button>
                </div>
                <div class="p-4">
                    <ul id="applicantList" class="space-y-3">
                        <!-- Applicants render here -->
                    </ul>
                </div>
            </div>

        </div>

    </main>

    <script type="module" src="../../js/admin/dashboard.js"></script>
</body>

</html>
