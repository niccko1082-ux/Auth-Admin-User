<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Presupuesto</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { protectRoute } from '../../js/guard.js';
        protectRoute('user');
    </script>
</head>

<body class="bg-gray-50 min-h-screen">

    <nav class="bg-emerald-600 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="font-bold text-xl flex items-center gap-2">
            <span>💰</span> Gestión de Gastos
        </h1>
        <div class="flex items-center gap-4">
            <span id="user-email" class="text-sm font-medium"></span>
            <button id="logoutBtn"
                class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Salir</button>
        </div>
    </nav>

    <main class="container mx-auto p-6 max-w-4xl">

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-emerald-500">
                <h3 class="text-gray-500 text-sm uppercase font-bold">Ingresos</h3>
                <p class="text-2xl font-bold text-emerald-600" id="totalIncome">$0.00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-red-500">
                <h3 class="text-gray-500 text-sm uppercase font-bold">Gastos</h3>
                <p class="text-2xl font-bold text-red-600" id="totalExpense">$0.00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                <h3 class="text-gray-500 text-sm uppercase font-bold">Balance</h3>
                <p class="text-2xl font-bold text-gray-800" id="netBalance">$0.00</p>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-8">

            <!-- Add Transaction -->
            <div class="w-full md:w-1/3">
                <div class="bg-white p-6 rounded-lg shadow-md sticky top-6">
                    <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Nuevo Movimiento</h2>
                    <form id="transactionForm" class="space-y-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Tipo</label>
                            <select id="type" class="w-full border rounded px-3 py-2 bg-white">
                                <option value="income">Ingreso (+)</option>
                                <option value="expense">Gasto (-)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Monto</label>
                            <input type="number" id="amount" class="w-full border rounded px-3 py-2" placeholder="0.00"
                                min="0" step="0.01" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Categoría</label>
                            <input type="text" id="category" class="w-full border rounded px-3 py-2"
                                placeholder="Ej: Salario, Comida" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Fecha</label>
                            <input type="date" id="date" class="w-full border rounded px-3 py-2" required>
                        </div>

                        <button type="submit"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-bold transition shadow">
                            Agregar
                        </button>
                    </form>
                </div>
            </div>

            <!-- Transaction List -->
            <div class="w-full md:w-2/3">
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                        <h2 class="text-xl font-bold text-gray-800">Historial</h2>
                        <select id="filterCategory" class="border rounded px-2 py-1 text-sm">
                            <option value="all">Todas las Categorías</option>
                            <!-- Options filled dynamically -->
                        </select>
                    </div>

                    <ul id="transactionList" class="divide-y divide-gray-100">
                        <!-- Transactions render here -->
                    </ul>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="../../js/user/dashboard.js"></script>
</body>

</html>
