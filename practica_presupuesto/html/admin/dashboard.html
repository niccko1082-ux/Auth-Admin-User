<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Auditoría</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { protectRoute } from '../../js/guard.js';
        protectRoute('admin');
    </script>
</head>

<body class="bg-gray-100 min-h-screen">

    <nav class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="font-bold text-xl flex items-center gap-2">
            <span>📉</span> Auditoría de Gastos
        </h1>
        <div class="flex items-center gap-4">
            <span id="user-email" class="text-sm font-medium"></span>
            <button id="logoutBtn"
                class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Salir</button>
        </div>
    </nav>

    <main class="container mx-auto p-6 max-w-5xl">

        <div class="flex flex-col gap-6">

            <!-- Summary -->
            <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">Todas las Transacciones</h2>
                    <p class="text-gray-500 text-sm">Vista global de movimientos de usuarios</p>
                </div>
                <div class="text-right">
                    <span id="totalTransactions"
                        class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">0 Movimientos</span>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-200 border-b text-gray-700 uppercase text-xs">
                            <tr>
                                <th class="p-4">Usuario ID</th>
                                <th class="p-4">Categoría</th>
                                <th class="p-4">Fecha</th>
                                <th class="p-4">Tipo</th>
                                <th class="p-4 text-right">Monto</th>
                                <th class="p-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="auditList">
                            <!-- Rows Render Here -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="../../js/admin/dashboard.js"></script>
</body>

</html>
