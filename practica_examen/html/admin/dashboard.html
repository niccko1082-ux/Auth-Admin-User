<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { protectRoute } from '../../js/guard.js';
        protectRoute('admin');
    </script>
</head>

<body class="bg-gray-100 min-h-screen">

    <nav class="bg-gray-800 text-white p-4 flex justify-between items-center shadow">
        <h1 class="font-bold text-xl">Admin Panel</h1>
        <div class="flex items-center gap-4">
            <span id="user-email" class="text-sm"></span>
            <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm">Logout</button>
        </div>
    </nav>

    <main class="container mx-auto p-6 max-w-4xl">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">All Tasks</h2>

        <div class="bg-white rounded shadow overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-4">ID</th>
                        <th class="p-4">Task</th>
                        <th class="p-4">User ID</th>
                        <th class="p-4">Status</th>
                        <th class="p-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="adminTaskList">
                    <!-- Tasks will load here -->
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="../../js/admin/dashboard.js"></script>
</body>

</html>
